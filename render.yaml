services:
  - type: web
    name: task-tracker
    runtime: node
    plan: free
    buildCommand: npm ci --prefix Back && npm ci --prefix Front && npm run build --prefix Front
    startCommand: npm start --prefix Back
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
